{% extends 'base.html' %}
{% block title %}Sign in · CentrAlign{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
  <section class="login-panel">
    <p class="eyebrow">CENTRALIGN FINANCE</p>
    <h1>Sign in</h1>
    <p class="muted">Use your demo company account to continue.</p>
    <form method="post" action="{{ url_for('login_post') }}">
      <div class="form-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button login-submit" type="submit">Sign in</button>
    </form>
  </section>
{% endblock %}
